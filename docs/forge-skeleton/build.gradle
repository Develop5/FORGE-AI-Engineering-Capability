plugins {
    id 'java'
    id 'application'
}

group = 'com.forge'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.forge.runtime.cli.ForgeCli'
}

tasks.named('test') {
    useJUnitPlatform()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
